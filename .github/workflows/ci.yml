name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Needs no submodule, no cache, no compile — a rustfmt run on the sources.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The same check the pre-commit hook runs locally.
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lkml-core is vendored as a submodule; checkout rewrites its
          # ssh URL to authenticated https, so no key is needed.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Unit tests
        run: cargo test
